                  tv.setText(label + ": " + min); tv.setTextColor(Color.WHITE); tv.setTextSize(13);
                  col.addView(tv);
                  SeekBar sb = new SeekBar(this);
                  sb.setMax(max - min); sb.setProgress(0);
                  sb.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar s, int p, boolean u) {
                          int v = p + min; tv.setText(label + ": " + v); cb.accept(v);
                      }
                      public void onStartTrackingTouch(SeekBar s) {}
                      public void onStopTrackingTouch(SeekBar s) {}
                  });
                  col.addView(sb);
                  content.addView(col);
              }
              private void addButton(String label, View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextColor(Color.parseColor("#00FF9C"));
                  b.setBackground(rounded("#1A1A1A", 6));
                  b.setOnClickListener(l);
                  content.addView(b);
              }
              private GradientDrawable rounded(String color, int radiusDp) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(Color.parseColor(color));
                  d.setCornerRadius(dp(radiusDp));
                  return d;
              }
              private int dp(int v) { return (int)(v * getResources().getDisplayMetrics().density); }
              @Override public void onDestroy() {
                  super.onDestroy();
                  if (root != null) wm.removeView(root);
                  stopForeground(true);
              }
          }
          XEOF

          cat > app/src/main/cpp/CMakeLists.txt <<'XEOF'
          cmake_minimum_required(VERSION 3.18)
          project(bryantfornitestuff LANGUAGES CXX)
          add_library(bryantfornitestuff SHARED axion.cpp)
          target_compile_options(bryantfornitestuff PRIVATE -O2 -fvisibility=hidden -std=c++20)
          target_link_libraries(bryantfornitestuff log android)
          XEOF

          cat > app/src/main/cpp/axion.cpp <<'XEOF'
          #include <jni.h>
          #include <cstdint>
          #include <cstring>
          #include <cstdlib>
          #include <unistd.h>
          #include <fcntl.h>
          #include <thread>
          #include <atomic>
          #include <fstream>
          #include <map>
          #include <string>
          #include <sys/ptrace.h>
          #include <sys/wait.h>
          #include <android/log.h>
          #define LOG(...) __android_log_print(ANDROID_LOG_INFO, "BRYANT", __VA_ARGS__)
          static std::atomic<bool> aimbot{false}, silent{false}, rage{false};
          static std::atomic<bool> infHealth{false}, speed{false}, flight{false};
          static std::atomic<bool> noclip{false}, allSkins{false}, esp{false};
          static std::atomic<int> aimSpeed{5}, fov{90}, speedMult{3};
          static pid_t g_pid = -1;
          static int g_memfd = -1;
          static uintptr_t g_base = 0;
          static std::map<std::string, uintptr_t> OFF;
          static void load_offsets() {
              const char* paths[] = {"/sdcard/Bryantfornitestuff/offsets.txt", "/data/local/tmp/offsets.txt"};
              for (const char* p : paths) {
                  std::ifstream f(p);
                  if (!f.is_open()) continue;
                  std::string line;
                  while (std::getline(f, line)) {
                      if (line.empty() || line[0] == '#') continue;
                      auto eq = line.find('=');
                      if (eq == std::string::npos) continue;
                      OFF[line.substr(0, eq)] = strtoull(line.substr(eq + 1).c_str(), nullptr, 16);
                  }
                  LOG("Loaded %zu offsets", OFF.size());
                  return;
              }
          }
          static pid_t find_pid() {
              FILE* f = popen("pidof com.epicgames.fortnite", "r");
              if (!f) return -1;
              char buf[32] = {0}; fgets(buf, 32, f); pclose(f);
              return atoi(buf);
          }
          static int open_mem(pid_t pid) {
              char p[64]; snprintf(p, 64, "/proc/%d/mem", pid);
              return open(p, O_RDWR);
          }
          static void aim_thread() {
              while (aimbot || silent || rage) usleep(1000);
          }
          static void player_thread() {
              while (infHealth || speed || flight || noclip || allSkins || esp) usleep(2000);
          }
          extern "C" JNIEXPORT void JNICALL Java_com_bryant_bryantfornitestuff_Native_init(JNIEnv*, jclass) {
              load_offsets();
              g_pid = find_pid();
              if (g_pid <= 0) { LOG("FN not running"); return; }
              g_memfd = open_mem(g_pid);
              if (g_memfd < 0) { LOG("mem fail"); return; }
              ptrace(PTRACE_ATTACH, g_pid, nullptr, nullptr);
              waitpid(g_pid, nullptr, 0);
              std::thread(aim_thread).detach();
              std::thread(player_thread).detach();
          }
          extern "C" JNIEXPORT void JNICALL Java_com_bryant_bryantfornitestuff_Native_setAimbot(JNIEnv*, jclass, jboolean v) { aimbot = v; }
          extern "C" JNIEXPORT void JNICALL Java_com_bryant_bryantfornitestuff_Native_setSilent(JNIEnv*, jclass, jboolean v) { silent = v; }
          extern "C" JNIEXPORT void JNICALL Java_com_bryant_bryantfornitestuff_Native_setRage(JNIEnv*, jclass, jboolean v) { rage = v; }
          extern "C" JNIEXPORT void JNICALL Java_com_bryant_bryantfornitestuff_Native_setInfHealth(JNIEnv*, jclass, jboolean v) { infHealth = v; }
          extern "C" JNIEXPORT void JNICALL Java_com_bryant_bryantfornitestuff_Native_setSpeed(JNIEnv*, jclass, jboolean v) { speed = v; }
          extern "C" JNIEXPORT void JNICALL Java_com_bryant_bryantfornitestuff_Native_setFlight(JNIEnv*, jclass, jboolean v) { flight = v; }
          extern "C" JNIEXPORT void JNICALL Java_com_bryant_bryantfornitestuff_Native_setNoclip(JNIEnv*, jclass, jboolean v) { noclip = v; }
          extern "C" JNIEXPORT void JNICALL Java_com_bryant_bryantfornitestuff_Native_setAllSkins(JNIEnv*, jclass, jboolean v) { allSkins = v; }
          extern "C" JNIEXPORT void JNICALL Java_com_bryant_bryantfornitestuff_Native_setEsp(JNIEnv*, jclass, jboolean v) { esp = v; }
          extern "C" JNIEXPORT void JNICALL Java_com_bryant_bryantfornitestuff_Native_setAimSpeed(JNIEnv*, jclass, jint v) { aimSpeed = v; }
          extern "C" JNIEXPORT void JNICALL Java_com_bryant_bryantfornitestuff_Native_setFov(JNIEnv*, jclass, jint v) { fov = v; }
          extern "C" JNIEXPORT void JNICALL Java_com_bryant_bryantfornitestuff_Native_setSpeedMult(JNIEnv*, jclass, jint v) { speedMult = v; }
          XEOF

          # Dedent â€” strip leading spaces from heredoc contents
          find . -type f \( -name "*.gradle" -o -name "*.java" -o -name "*.cpp" -o -name "*.xml" -o -name "*.txt" \) -exec sed -i 's/^          //' {} +
