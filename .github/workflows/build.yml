name: Build Bryantfornitestuff
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - name: Generate project
        run: |
          mkdir -p BryantFN/app/src/main/java/com/bryant/bryantfornitestuff
          cd BryantFN
          cat > settings.gradle <<'XEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Bryantfornitestuff"
          include ':app'
          XEOF
          cat > build.gradle <<'XEOF'
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          XEOF
          cat > gradle.properties <<'XEOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          XEOF
          cat > app/build.gradle <<'XEOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.bryant.bryantfornitestuff'
              compileSdk 33
              defaultConfig {
                  applicationId "com.bryant.bryantfornitestuff"
                  minSdk 26
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          XEOF
          cat > app/src/main/AndroidManifest.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application
                  android:label="Bryantfornitestuff"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OverlayService"
                      android:exported="false"/>
              </application>
          </manifest>
          XEOF
          cat > app/src/main/java/com/bryant/bryantfornitestuff/MainActivity.java <<'XEOF'
          package com.bryant.bryantfornitestuff;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
                  }
                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:" + getPackageName())));
                  } else {
                      startService(new Intent(this, OverlayService.class));
                      finish();
                  }
              }
          }
          XEOF
          cat > app/src/main/java/com/bryant/bryantfornitestuff/Native.java <<'XEOF'
          package com.bryant.bryantfornitestuff;

          import android.util.Log;

          public class Native {
              private static final String T = "BRYANT";
              public static void init() { Log.i(T, "init"); }
              public static void setAimbot(boolean v) { Log.i(T, "aimbot=" + v); }
              public static void setSilent(boolean v) { Log.i(T, "silent=" + v); }
              public static void setRage(boolean v) { Log.i(T, "rage=" + v); }
              public static void setInfHealth(boolean v) { Log.i(T, "infHealth=" + v); }
              public static void setSpeed(boolean v) { Log.i(T, "speed=" + v); }
              public static void setFlight(boolean v) { Log.i(T, "flight=" + v); }
              public static void setNoclip(boolean v) { Log.i(T, "noclip=" + v); }
              public static void setAllSkins(boolean v) { Log.i(T, "allSkins=" + v); }
              public static void setEsp(boolean v) { Log.i(T, "esp=" + v); }
              public static void setAimSpeed(int v) { Log.i(T, "aimSpeed=" + v); }
              public static void setFov(int v) { Log.i(T, "fov=" + v); }
              public static void setSpeedMult(int v) { Log.i(T, "speedMult=" + v); }
          }
          XEOF
          cat > app/src/main/java/com/bryant/bryantfornitestuff/OverlayService.java <<'XEOF'
          package com.bryant.bryantfornitestuff;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.IBinder;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.CompoundButton;
          import android.widget.LinearLayout;
          import android.widget.SeekBar;
          import android.widget.Switch;
          import android.widget.TextView;
          import java.util.function.Consumer;
          import java.util.function.IntConsumer;

          public class OverlayService extends Service {
              private WindowManager wm;
              private WindowManager.LayoutParams params;
              private LinearLayout root, content, bodyWrapper;
              private boolean collapsed = false;

              @Override
              public IBinder onBind(Intent i) { return null; }

              @Override
              public void onCreate() {
                  super.onCreate();
                  String chId = "bryant";
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel(chId, "Bryantfornitestuff", NotificationManager.IMPORTANCE_LOW);
                      ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(ch);
                  }
                  Notification n = (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                      ? new Notification.Builder(this, chId).setContentTitle("Bryantfornitestuff").setSmallIcon(android.R.drawable.ic_menu_info_details).build()
                      : new Notification.Builder(this).setContentTitle("Bryantfornitestuff").setSmallIcon(android.R.drawable.ic_menu_info_details).build();
                  startForeground(1, n);

                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  root = buildRoot();
                  params = new WindowManager.LayoutParams(
                      dp(300), WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT);
                  params.gravity = Gravity.TOP | Gravity.START;
                  params.x = dp(20);
                  params.y = dp(60);
                  wm.addView(root, params);
                  renderTab("Combat");
              }

              private LinearLayout buildRoot() {
                  LinearLayout r = new LinearLayout(this);
                  r.setOrientation(LinearLayout.VERTICAL);
                  r.setBackground(rounded("#CC0A0A0A", 12));
                  r.setPadding(dp(10), dp(10), dp(10), dp(10));

                  LinearLayout titleRow = new LinearLayout(this);
                  titleRow.setOrientation(LinearLayout.HORIZONTAL);
                  titleRow.setPadding(dp(6), dp(4), dp(6), dp(8));

                  TextView title = new TextView(this);
                  title.setText("BRYANTFORNITESTUFF");
                  title.setTextColor(Color.parseColor("#00FF9C"));
                  title.setTextSize(15);
                  title.setLayoutParams(new LinearLayout.LayoutParams(0, -2, 1f));
                  titleRow.addView(title);

                  TextView collapse = new TextView(this);
                  collapse.setText("_");
                  collapse.setTextColor(Color.parseColor("#00FF9C"));
                  collapse.setTextSize(22);
                  collapse.setPadding(dp(8), 0, dp(8), 0);
                  collapse.setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) { toggleCollapse(); }
                  });
                  titleRow.addView(collapse);

                  titleRow.setOnTouchListener(new View.OnTouchListener() {
                      float sx, sy; int px, py;
                      public boolean onTouch(View v, MotionEvent e) {
                          switch (e.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  sx = e.getRawX(); sy = e.getRawY();
                                  px = params.x; py = params.y; return true;
                              case MotionEvent.ACTION_MOVE:
                                  params.x = px + (int)(e.getRawX() - sx);
                                  params.y = py + (int)(e.getRawY() - sy);
                                  wm.updateViewLayout(root, params); return true;
                          }
                          return false;
                      }
                  });
                  r.addView(titleRow);

                  bodyWrapper = new LinearLayout(this);
                  bodyWrapper.setOrientation(LinearLayout.VERTICAL);

                  LinearLayout tabs = new LinearLayout(this);
                  tabs.setOrientation(LinearLayout.HORIZONTAL);
                  String[] tabNames = {"Combat","Player","Visuals","Skins","Settings"};
                  for (String t : tabNames) tabs.addView(makeTab(t));
                  bodyWrapper.addView(tabs);

                  content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(dp(6), dp(8), dp(6), dp(6));
                  bodyWrapper.addView(content);

                  r.addView(bodyWrapper);
                  return r;
              }

              private View makeTab(final String name) {
                  TextView tv = new TextView(this);
                  tv.setText(name);
                  tv.setTextColor(Color.parseColor("#00FF9C"));
                  tv.setTextSize(11);
                  tv.setPadding(dp(8), dp(6), dp(8), dp(6));
                  tv.setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) { renderTab(name); }
                  });
                  return tv;
              }

              private void toggleCollapse() {
                  collapsed = !collapsed;
                  bodyWrapper.setVisibility(collapsed ? View.GONE : View.VISIBLE);
              }

              private void renderTab(String tab) {
                  content.removeAllViews();
                  if (tab.equals("Combat")) {
                      addToggle("Aimbot", new Consumer<Boolean>() { public void accept(Boolean v) { Native.setAimbot(v); } });
                      addToggle("Silent Aim", new Consumer<Boolean>() { public void accept(Boolean v) { Native.setSilent(v); } });
                      addToggle("Rage Mode", new Consumer<Boolean>() { public void accept(Boolean v) { Native.setRage(v); } });
                      addSlider("Aim Speed", 1, 20, new IntConsumer() { public void accept(int v) { Native.setAimSpeed(v); } });
                      addSlider("FOV", 1, 360, new IntConsumer() { public void accept(int v) { Native.setFov(v); } });
                  } else if (tab.equals("Player")) {
                      addToggle("Infinite Health", new Consumer<Boolean>() { public void accept(Boolean v) { Native.setInfHealth(v); } });
                      addToggle("Speed Boost", new Consumer<Boolean>() { public void accept(Boolean v) { Native.setSpeed(v); } });
                      addSlider("Speed Mult", 1, 10, new IntConsumer() { public void accept(int v) { Native.setSpeedMult(v); } });
                      addToggle("Flight", new Consumer<Boolean>() { public void accept(Boolean v) { Native.setFlight(v); } });
                      addToggle("Noclip", new Consumer<Boolean>() { public void accept(Boolean v) { Native.setNoclip(v); } });
                  } else if (tab.equals("Visuals")) {
                      addToggle("ESP", new Consumer<Boolean>() { public void accept(Boolean v) { Native.setEsp(v); } });
                  } else if (tab.equals("Skins")) {
                      addButton("Unlock All Skins", new View.OnClickListener() { public void onClick(View v) { Native.setAllSkins(true); } });
                  } else if (tab.equals("Settings")) {
                      addButton("Exit", new View.OnClickListener() { public void onClick(View v) { stopSelf(); } });
                  }
              }

              private void addToggle(String label, final Consumer<Boolean> cb) {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setPadding(0, dp(4), 0, dp(4));
                  TextView tv = new TextView(this);
                  tv.setText(label);
                  tv.setTextColor(Color.WHITE);
                  tv.setTextSize(13);
                  tv.setLayoutParams(new LinearLayout.LayoutParams(0, -2, 1f));
                  row.addView(tv);
                  Switch s = new Switch(this);
                  s.setOnCheckedChangeListener(new CompoundButton.OnCheckedChangeListener() {
                      public void onCheckedChanged(CompoundButton b, boolean v) { cb.accept(v); }
                  });
                  row.addView(s);
                  content.addView(row);
              }

              private void addSlider(String label, final int min, int max, final IntConsumer cb) {
                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setPadding(0, dp(4), 0, dp(4));
                  final TextView tv = new TextView(this);
                  tv.setText(label + ": " + min);
                  tv.setTextColor(Color.WHITE);
                  tv.setTextSize(13);
                  col.addView(tv);
                  SeekBar sb = new SeekBar(this);
                  sb.setMax(max - min);
                  sb.setProgress(0);
                  sb.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar s, int p, boolean u) {
                          int v = p + min;
                          tv.setText(label + ": " + v);
                          cb.accept(v);
                      }
                      public void onStartTrackingTouch(SeekBar s) {}
                      public void onStopTrackingTouch(SeekBar s) {}
                  });
                  col.addView(sb);
                  content.addView(col);
              }

              private void addButton(String label, View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextColor(Color.parseColor("#00FF9C"));
                  b.setBackground(rounded("#1A1A1A", 6));
                  b.setOnClickListener(l);
                  content.addView(b);
              }

              private GradientDrawable rounded(String color, int radiusDp) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(Color.parseColor(color));
                  d.setCornerRadius(dp(radiusDp));
                  return d;
              }

              private int dp(int v) {
                  return (int)(v * getResources().getDisplayMetrics().density);
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (root != null) wm.removeView(root);
                  stopForeground(true);
              }
          }
          XEOF
          echo "Generated."
